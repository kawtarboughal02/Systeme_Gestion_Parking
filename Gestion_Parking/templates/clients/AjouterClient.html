{% block main_content %}
<section class="container">
    <div class="row justify-content-around text-center mt-5">
        <div class="col-sm-8 ">
            <h3>Ajouter un Client</h3>
        </div>
    </div>
    <div class="row justify-content-around mt-3">
        <div class="col-sm-4">
            <form action="" method="POST"class="bg-white p-3 rounded shadow">
                 {% csrf_token %}

        </div>

    </div>
</section>
